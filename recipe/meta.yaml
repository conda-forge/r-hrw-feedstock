{% set version = "1.0-6" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-hrw
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/HRW_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/HRW/HRW_{{ version }}.tar.gz
  sha256: b1ec47bf381a68a6ddd39c2917406a9364d4b1f381a608eba7075b24fe0fadcd

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-kernsmooth
  run:
    - r-base
    - r-kernsmooth

test:
  commands:
    - $R -e "library('HRW')"           # [not win]
    - "\"%R%\" -e \"library('HRW')\""  # [win]

about:
  home: https://CRAN.R-project.org/package=HRW
  license: GPL-2.0-or-later
  summary: 'The book "Semiparametric Regression with R" by J. Harezlak, D. Ruppert & M.P. Wand (2018, Springer; ISBN: 978-1-4939-8851-8) makes use of datasets and scripts to explain semiparametric regression concepts. Each of the book''s scripts are contained in this package as well as datasets that are not within other
    R packages. Functions that aid semiparametric regression analysis are also included.'
  license_family: GPL2
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2

extra:
  recipe-maintainers:
    - conda-forge/r
